  '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
  "</styleSheet>";

/* cell helpers: s = string, n = number, f = formula (with cached value) */
const xs = (v, st) => ({ t: "s", v: v, s: st || 0 });
const xn = (v, st) => ({ t: "n", v: v, s: st || 0 });
const xf = (f, v, st) => ({ t: "f", f: f, v: v, s: st || 0 });
function sheetXML(sh) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
  x += '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>';
  x += '<sheetViews><sheetView workbookViewId="0"' + (sh.first ? ' tabSelected="1"' : "") + ">" +
    (sh.freeze ? '<pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) +
      '" activePane="bottomLeft" state="frozen"/>' : "") + "</sheetView></sheetViews>";
  x += '<sheetFormatPr defaultRowHeight="15"/>';
  if (sh.cols) x += "<cols>" + sh.cols.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) +
    '" width="' + w + '" customWidth="1"/>').join("") + "</cols>";
  x += "<sheetData>";
  sh.rows.forEach((row, ri) => {
    if (!row) return;
    x += '<row r="' + (ri + 1) + '">';
    row.forEach((c, ci) => {
      if (c === null || c === undefined) return;
      const ref = colL(ci) + (ri + 1);
      if (c.t === "s") x += '<c r="' + ref + '" s="' + c.s + '" t="inlineStr"><is><t xml:space="preserve">' +
        xesc(c.v) + "</t></is></c>";
      else if (c.t === "n") x += '<c r="' + ref + '" s="' + c.s + '"><v>' + c.v + "</v></c>";
      else if (c.t === "f") x += '<c r="' + ref + '" s="' + c.s + '"><f>' + xesc(c.f) + "</f><v>" +
        (typeof c.v === "number" && isFinite(c.v) ? c.v : 0) + "</v></c>";
    });
    x += "</row>";
  });
  x += "</sheetData>";
  if (sh.merges && sh.merges.length) x += '<mergeCells count="' + sh.merges.length + '">' +
    sh.merges.map(m => '<mergeCell ref="' + m + '"/>').join("") + "</mergeCells>";
  x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>' +
    '<pageSetup orientation="' + (sh.landscape ? "landscape" : "portrait") + '" fitToWidth="1" fitToHeight="0"/>';
  return x + "</worksheet>";
}
function buildXlsx(sheets, title) {
  const enc = new TextEncoder(), f = [];
  const add = (n, s) => f.push({ name: n, data: enc.encode(s) });
  add("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
      '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    "</Types>");
  add("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    "</Relationships>");
  add("docProps/core.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>' + xesc(title) + "</dc:title>" +
    "<dc:creator>" + xesc(S.settings.observerName || "Saks Admin Hub") + "</dc:creator>" +
    '<dcterms:created xsi:type="dcterms:W3CDTF">' + new Date().toISOString().slice(0, 19) + "Z</dcterms:created>" +
    "</cp:coreProperties>");
  add("xl/workbook.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<bookViews><workbookView activeTab="0"/></bookViews><sheets>' +
    sheets.map((s, i) => '<sheet name="' + xesc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("") +
    '</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
  add("xl/_rels/workbook.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) +
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
      (i + 1) + '.xml"/>').join("") +
    '<Relationship Id="rId' + (sheets.length + 1) +
    '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    "</Relationships>");
  add("xl/styles.xml", XLSX_STYLES);
  sheets.forEach((s, i) => add("xl/worksheets/sheet" + (i + 1) + ".xml", sheetXML(s)));
  return zipStore(f);
}

/* The monthly workbook: Summary, Daily, Entries. */
function monthWorkbook(key) {
  const list = monthEntries(key).slice().sort((a, b) =>
    a.date.localeCompare(b.date) || (a.createdAt || "").localeCompare(b.createdAt || ""));
  const t = totalsOf(list), days = daysInMonth(key), mName = monthName(key);
  const who = S.settings.observerName || "", school = S.settings.school || SCHOOL_NAME;
  const NC = TIME_CATS.length;                       // 7 category columns: C..I
  const totCol = colL(2 + NC), aftCol = colL(3 + NC); // J, K

  /* ---- Daily ---- */
  const D0 = 4, DN = D0 + days.length - 1;           // first/last data row (1-based)
  const daily = { name: "Daily", freeze: 3, landscape: true,
    cols: [12, 6].concat(TIME_CATS.map(() => 14.5), [9, 11]), rows: [] };
  daily.rows[0] = [xs("Daily minutes by category — " + mName, X.title)];
  daily.rows[1] = [xs(school + (who ? " · " + who : "") + " · minutes, entered daily", X.sub)];
  daily.rows[2] = [xs("Date", X.head), xs("Day", X.head)].concat(TIME_CATS.map(c => xs(c.name, X.headR)),
    [xs("Total", X.headR), xs("After hours", X.headR)]);
  days.forEach((d, i) => {
    const r = D0 + i, we = isWeekend(d), dt = totalsOf(list.filter(e => e.date === d));
    daily.rows[r - 1] = [xn(excelDate(d), we ? X.wkDate : X.date),
      xs(new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" }), we ? X.wk : X.def)]
      .concat(TIME_CATS.map(c => dt[c.key] ? xn(dt[c.key], we ? X.wk : X.def) : (we ? xs("", X.wk) : null)),
        [xf("SUM(C" + r + ":" + colL(1 + NC) + r + ")", dt.all, we ? X.wk : X.bold),
         dt.after ? xn(dt.after, we ? X.wk : X.def) : (we ? xs("", X.wk) : null)]);
  });
  const DT = DN + 1;
  daily.rows[DT - 1] = [xs("Total minutes", X.totL), xs("", X.totL)].concat(
    TIME_CATS.map((c, i) => xf("SUM(" + colL(2 + i) + D0 + ":" + colL(2 + i) + DN + ")", t[c.key], X.totN)),
    [xf("SUM(" + totCol + D0 + ":" + totCol + DN + ")", t.all, X.totN),
     xf("SUM(" + aftCol + D0 + ":" + aftCol + DN + ")", t.after, X.totN)]);
  daily.rows[DT] = [xs("Total hours", X.bold), null].concat(
    TIME_CATS.map((c, i) => xf(colL(2 + i) + DT + "/60", t[c.key] / 60, X.hrs)),
    [xf(totCol + DT + "/60", t.all / 60, X.hrs), xf(aftCol + DT + "/60", t.after / 60, X.hrs)]);
  daily.rows[DT + 2] = [xs("Shaded rows are weekends. Blank means nothing was logged.", X.foot)];

  /* ---- Entries ---- */
  const entries = { name: "Entries", freeze: 1, landscape: true,
    cols: [12, 6, 20, 9, 8, 11, 17, 60], rows: [] };
  entries.rows[0] = ["Date", "Day", "Category", "Minutes", "Hours", "After hours", "Source", "Note"]
    .map((h, i) => xs(h, i === 3 || i === 4 ? X.headR : X.head));
  list.forEach((e, i) => {
    const r = i + 2;
    entries.rows[r - 1] = [xn(excelDate(e.date), X.date),
      xs(new Date(e.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" })),
      xs(CAT[e.category] ? CAT[e.category].name : e.category), xn(e.minutes),
      xf("D" + r + "/60", e.minutes / 60, X.hrs), xs(e.afterHours ? "Yes" : "No"),
      xs(e.source === "atot" ? "ATOT walkthrough" : "Manual"), xs(e.note || "", X.wrap)];
  });
  const EN = list.length + 1;
  entries.rows[EN] = [xs("Total", X.totL), xs("", X.totL), xs("", X.totL),
    xf("SUM(D2:D" + Math.max(2, EN) + ")", t.all, X.totN), xf("D" + (EN + 1) + "/60", t.all / 60, X.totH),
    xs("", X.totL), xs("", X.totL), xs("", X.totL)];

  /* ---- Summary ---- */
  const sum = { name: "Summary", first: true, cols: [42, 11, 10, 11, 50], rows: [] };
  sum.rows[0] = [xs("Principal Time Report — " + mName, X.title)];
  sum.rows[1] = [xs(school + " · " + (S.settings.district || DISTRICT_NAME), X.sub)];
  sum.rows[2] = [xs("Principal: " + (who || "________________"), X.sub)];
  sum.rows[4] = [xs("Category", X.head), xs("Minutes", X.headR), xs("Hours", X.headR), xs("% of time", X.headR)];
  const S0 = 6, SN = S0 + NC - 1, ST = SN + 1;
  TIME_CATS.forEach((c, i) => {
    const r = S0 + i, col = colL(2 + i);
    sum.rows[r - 1] = [xs(c.name), xf("Daily!" + col + DT, t[c.key]), xf("B" + r + "/60", t[c.key] / 60, X.hrs),
      xf("IF($B$" + ST + "=0,0,B" + r + "/$B$" + ST + ")", t.all ? t[c.key] / t.all : 0, X.pct)];
  });
  sum.rows[ST - 1] = [xs("Total", X.totL), xf("SUM(B" + S0 + ":B" + SN + ")", t.all, X.totN),
    xf("B" + ST + "/60", t.all / 60, X.totH), xf("IF(B" + ST + "=0,0,SUM(D" + S0 + ":D" + SN + "))", t.all ? 1 : 0, X.totP)];
  const atot = list.filter(e => e.source === "atot").reduce((n, e) => n + e.minutes, 0);
  const nDays = new Set(list.map(e => e.date)).size;
  let r = ST + 2;
  sum.rows[r - 1] = [xs("Days with time logged"),
    xf("COUNTIF(Daily!" + totCol + D0 + ":" + totCol + DN + ',">0")', nDays)]; r++;
  sum.rows[r - 1] = [xs("After-hours / event time"), xf("Daily!" + aftCol + DT, t.after),
    xf("B" + r + "/60", t.after / 60, X.hrs)]; r++;
  sum.rows[r - 1] = [xs("Walkthrough time (in Instructional Leader)"),
    xf('SUMIF(Entries!G2:G' + Math.max(2, EN) + ',"ATOT walkthrough",Entries!D2:D' + Math.max(2, EN) + ")", atot),
    xf("B" + r + "/60", atot / 60, X.hrs)]; r++;
  const others = list.filter(e => e.category === "other");
  r++;
  sum.rows[r - 1] = [xs("What “Other” was", X.head), xs("Minutes", X.headR), xs("", X.head), xs("", X.head), xs("Note", X.head)]; r++;
  if (!others.length) { sum.rows[r - 1] = [xs("No Other time this month.", X.sub)]; r++; }
  others.forEach(e => {
    sum.rows[r - 1] = [xn(excelDate(e.date), X.date), xn(e.minutes), null, null, xs(e.note || "", X.wrap)]; r++;
  });
  r++;
  sum.rows[r - 1] = [xs("Minutes are entered by the principal each day. Walkthrough minutes come from the " +
    "ATOT visit timer and are counted as Instructional Leader.", X.foot)];
  sum.rows[r] = [xs("Generated " + new Date().toLocaleDateString("en-US") + " by Saks Admin Hub.", X.foot)];

  return buildXlsx([sum, daily, entries], "Principal Time Report — " + mName);
}
async function exportMonth(share) {
  const key = monthKey || todayISO().slice(0, 7);
  if (!monthEntries(key).length) return toast("Nothing logged this month");
  const name = "Saks Principal Time " + key + ".xlsx";
  const blob = monthWorkbook(key);
  if (share && navigator.canShare) {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Principal time — " + monthName(key) }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
  }
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1500);
  toast("Excel file downloaded");
}

  if (deferredPrompt) document.getElementById("islot").innerHTML =
    '<button class="btn pri full" style="margin-top:9px" onclick="doInstall()">Install app</button>';
}
async function setSetting(k, v) { S.settings[k] = v; await saveSettings(); toast("Saved"); }
async function toggleSection(k) {

async function saveSheetUrl() {
  const u = val("sh_url");
  if (u && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(u))
    return toast("That does not look like an Apps Script /exec URL");
  const tu = val("sh_turl");
  if (tu && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(tu))
    return toast("The time log URL does not look like an Apps Script /exec URL");
  S.settings.sheetUrl = u; S.settings.timeSheetUrl = tu; S.settings.sheetSecret = val("sh_secret");
  await saveSettings();
  toast(u || tu ? "Saved" : "Disconnected"); route();
}
async function testSheet() {
  const u = val("sh_url");
  if (!u) return toast("Paste the URL first");
  toast("Testing…");
  try {
    const res = await fetch(u, { method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: "walkthrough-v1", secret: val("sh_secret"), test: true }) });
    const t = await res.text();
    let j = null; try { j = JSON.parse(t); } catch (e) {}
    if (j && j.status === "ok") {
      S.settings.sheetUrl = u; S.settings.sheetSecret = val("sh_secret");
      await saveSettings();
      sheet("Connected", '<p class="tiny muted" style="margin:0 0 13px">Your Sheet answered. ' +
        esc(j.message || "") + '</p><button class="btn pri full" onclick="closeSheet();syncNow(true)">' +
        "Send any waiting visits</button>");
    } else {
      sheet("Could not connect", '<div class="warnbox"><h4>The Sheet did not answer as expected</h4>' +
        '<div class="tiny" style="margin-top:6px">' + esc((t || "").slice(0, 300)) + "</div></div>" +
        '<p class="tiny muted" style="margin:0 0 12px">Most common cause: the deployment is not set to ' +
        '<b>Execute as Me</b> and <b>Anyone</b> has access. Redeploy and try again.</p>' +
        '<button class="btn full" onclick="closeSheet()">Close</button>');
    }
  } catch (e) {
    sheet("Could not connect", '<div class="warnbox"><h4>Request failed</h4>' +
      '<div class="tiny" style="margin-top:6px">' + esc(e.message) + "</div></div>" +
      '<p class="tiny muted" style="margin:0 0 12px">Check the URL ends in <code>/exec</code>, and that ' +
      "you are online.</p><button class='btn full' onclick='closeSheet()'>Close</button>");
  }
}

/* ---------- export ---------- */
function download(name, text, mime) {
  const b = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 400);
}
function csvCell(v) {
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  if (!S.visits.length) return toast("No visits to export");
  const rows = [sheetHeader()].concat(
    S.visits.slice().sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || "")).map(sheetRow));
  download("saks-walkthroughs-" + todayISO() + ".csv",
    rows.map(r => r.map(csvCell).join(",")).join("\n"), "text/csv;charset=utf-8");
  toast("CSV downloaded");
}
function exportJSON() {
  download("admin-hub-backup-" + todayISO() + ".json",
    JSON.stringify({ app: "adminhub", version: 1, exportedAt: now(),
      staff: S.staff, visits: S.visits, time: S.time, settings: S.settings }, null, 2), "application/json");
  toast("Backup downloaded");
}
function importJSON(input) {
  const f = input.files && input.files[0]; input.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { return toast("Not a readable backup"); }
    if (!d || (d.app !== "adminhub" && d.app !== "walkthrough")) return toast("Not an Admin Hub or ATOT backup");
    confirmSheet("Restore this backup?", "Everything on this device is replaced.", "Replace", async () => {
      for (const s of STORES) await dbClear(s);
      for (const t of d.staff || []) await dbPut("staff", t);
      for (const v of d.visits || []) await dbPut("visits", v);
      for (const e of d.time || []) await dbPut("time", e);
      await dbPut("meta", { id: "rosterSeeded", at: now() });
      if (d.settings) { d.settings.id = "settings"; await dbPut("meta", d.settings); }
      await loadAll(); toast("Restored"); location.hash = "#/home"; route();
    });
  };
  r.readAsText(f);
}
function wipeAll() {
  confirmSheet("Erase everything?", "All staff, observations, and time entries on this device are deleted. Rows already " +
    "in your Google Sheet stay there.", "Erase", async () => {
      for (const s of STORES) await dbClear(s);
      S.staff = []; S.visits = []; S.time = []; S.draft = null; S.settings = defaultSettings();
      S.tomb = { id: "timeTombstones", ids: [] };
      await dbPut("meta", S.settings); await dbPut("meta", { id: "rosterSeeded", at: now() });
      toast("Erased"); location.hash = "#/home"; route();
    });
}

let _tourI = 0;
function showTour(i) {
  const st = tourSteps();
  _tourI = Math.max(0, Math.min(i || 0, st.length - 1));
  const x = st[_tourI];
  sheet("", '<div class="tour"><div class="dots">' + st.map((_, k) => '<span class="' + (k === _tourI ? "on" : "") +
    '"></span>').join("") + '</div><div class="art">' + x.art + "</div><h3>" + esc(x.title) + "</h3>" + x.body +
    '<div class="btnrow">' + (_tourI ? '<button class="btn" onclick="showTour(_tourI-1)">Back</button>' :
      '<button class="btn" onclick="endTour()">Skip</button>') +
    (x.last ? '<button class="btn pri" onclick="endTour(true)">Start using it</button>' :
      '<button class="btn pri" onclick="showTour(_tourI+1)">Next</button>') + "</div></div>");
}
async function endTour(saveName) {
  if (saveName) { const n = val("tour_name"); if (n) { S.settings.observerName = n; await saveSettings(); } }

  closeSheet(); route();
}
/* ---------- install + SW + boot ---------- */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (location.hash === "#/more") viewMore();
});
/* The guide is a plain page hosted next to the app. Opening it in a new tab
   keeps the installed app window on whatever the principal was doing. */
function openGuide() {
  const url = new URL("guide.html", location.href).href;
  const w = window.open(url, "_blank", "noopener");
  if (!w) location.href = url;          // popup blocked — navigate instead
}
async function doInstall() {
  if (!deferredPrompt) return toast("Use your browser's Add to Home Screen");
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; viewMore();
}
if ("serviceWorker" in navigator && location.protocol !== "file:")
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.hidden && S.draft) saveDraft(); });

(async function boot() {
  await openDB();
  await loadAll();
  if (!location.hash) location.hash = "#/home";
  route();
  if (!(await dbAll("meta")).some(x => x.id === "toured")) setTimeout(() => showTour(0), 350);
  if (S.settings.autoSync && S.settings.sheetUrl && navigator.onLine) setTimeout(() => syncNow(false), 900);
})();
