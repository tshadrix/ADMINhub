<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  manifest-src 'self';
  worker-src 'self';
  connect-src 'self' https://script.google.com https://script.googleusercontent.com;
  form-action 'none';
  base-uri 'none';
  object-src 'none';
  frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#a3121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin Hub">
<meta name="description" content="Saks High School Admin Hub: classroom walkthroughs aligned to the Alabama Teacher Observation Tool, and a daily time log by category. A local tool, not affiliated with or endorsed by ALSDE.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Saks Admin Hub</title>
<style>
:root{
  --bg:#f5f4f2; --card:#ffffff; --ink:#16181d; --muted:#5f636c; --faint:#8d929c;
  --brand:#a3121b; --brand-soft:#fbeaeb; --brand-ink:#a3121b;
  --line:#e5e4e1; --radius:14px;
  --series-1:#2a78d6;              /* data mark — validated vs #ffffff */
  --grid:#e1e0d9; --baseline:#c3c2b7;
  --good:#0ca30c; --warn:#b45309; --warn-soft:#fdf3e3; --bad:#c0392f; --bad-soft:#fdecea;
  --shadow:0 1px 2px rgba(16,18,29,.06),0 4px 14px rgba(16,18,29,.05);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --card:#191c22; --ink:#e9eaee; --muted:#9aa0aa; --faint:#6d737d;
    --brand:#e0606a; --brand-soft:#2c1617; --brand-ink:#5c0a10;
    --line:#282c34;
    --series-1:#3987e5;            /* data mark — validated vs #191c22 */
    --grid:#2c2c2a; --baseline:#383835;
    --good:#0ca30c; --warn:#e0a458; --warn-soft:#33260f; --bad:#e07068; --bad-soft:#331a18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(64px + var(--safe-b));overscroll-behavior-y:contain}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--series-1);text-decoration:none}

header.top{position:sticky;top:0;z-index:40;background:var(--brand-ink);color:#fff;
  padding:calc(var(--safe-t) + 13px) 15px 13px;display:flex;align-items:center;gap:11px}
header.top .ttl{font-size:18px;font-weight:650;letter-spacing:-.02em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{font-size:11.5px;font-weight:400;opacity:.78;display:block;margin-top:1px}
header.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:9px;
  padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.back{background:none!important;padding:8px 4px 8px 0!important;font-size:22px!important;line-height:1}
main{padding:14px 15px 22px;max-width:820px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--card) 93%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.tabs a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--faint);
  font-size:10px;font-weight:600;display:block}
nav.tabs a .ic{display:block;font-size:19px;line-height:1.3}
nav.tabs a.on{color:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px;box-shadow:var(--shadow);margin-bottom:11px}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.sect{margin:20px 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint)}
.sect:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:11px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.tiny{font-size:12.5px}.mini{font-size:11.5px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
.empty .big{font-size:32px;display:block;margin-bottom:8px;opacity:.45}
.hr{height:1px;background:var(--line);margin:11px -13px}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;
  font-weight:650;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.flat{background:var(--bg);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.stat .l{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}

label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=password],
select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);outline:none;font-size:16px}
textarea{resize:vertical;min-height:74px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 15px;
  border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-weight:600;font-size:15px;cursor:pointer;text-align:center}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.full{display:flex;width:100%}
.btn.sm{padding:8px 11px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px}
.btnrow > *{flex:1}

/* section chips inside capture */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips button .dot{display:inline-block;width:6px;height:6px;border-radius:99px;
  background:var(--series-1);margin-left:5px;vertical-align:middle}

.timer{background:var(--brand-ink);color:#fff;border-radius:var(--radius);padding:13px 15px;
  margin-bottom:11px;display:flex;align-items:center;gap:12px}
.timer .clock{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer button{background:rgba(255,255,255,.17);border:0;color:#fff;border-radius:9px;
  padding:9px 12px;font-weight:600;cursor:pointer;font-size:13.5px}

/* indicator rating rows */
.dim{margin-bottom:11px}
.dimhead{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;box-shadow:var(--shadow)}
.dimhead.open{border-radius:var(--radius) var(--radius) 0 0;border-bottom-color:transparent}
.dimhead .nm{flex:1;font-weight:650;font-size:14.5px}
.dimhead .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dimhead .car{color:var(--faint);font-size:15px}
.dimbody{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);
  background:var(--card);padding:0 13px 6px;box-shadow:var(--shadow)}
.ind{padding:11px 0;border-bottom:1px solid var(--line)}
.ind:last-child{border-bottom:0}
.ind .q{font-size:14px;line-height:1.4;margin-bottom:9px}
.ind .q b{font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.03em}
.scale{display:flex;gap:5px}
.scale button{flex:1;padding:9px 2px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.scale button.na{flex:0 0 44px;font-weight:600;font-size:13px}
.scale button.on{background:var(--series-1);border-color:var(--series-1);color:#fff}
.scale button.on.na{background:var(--faint);border-color:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--muted);
  padding:9px 0 2px;line-height:1.4}
.legend span b{color:var(--ink)}

/* two-column tallies */
.tally2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tcol h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
  margin-bottom:7px;font-weight:700}
/* Tally buttons on the Actions screen.
   NOTE: do NOT name this ".tap" — that collides with ".card.tap" (a tappable
   card) at equal specificity and silently turns every card into a flex row. */
.tallybtn{display:flex;align-items:center;gap:7px;width:100%;padding:9px 10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;
  font-size:13px;text-align:left;line-height:1.3}
.tallybtn.hit{border-color:var(--series-1);background:color-mix(in srgb,var(--series-1) 9%,var(--card))}
.tallybtn .n{margin-left:auto;font-weight:700;color:var(--series-1);font-variant-numeric:tabular-nums;
  font-size:13px;flex:none}
.tallybtn .lb{flex:1;min-width:0}

/* checklists */
.ck{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);
  cursor:pointer}
.ck:last-child{border-bottom:0}
.ck .bx{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:13px;color:transparent;font-weight:700}
.ck.yes .bx{background:var(--good);border-color:var(--good);color:#fff}
.ck.no .bx{background:var(--bad);border-color:var(--bad);color:#fff}
.ck .tx{flex:1;font-size:13.5px;line-height:1.35}
.ck.no .tx{color:var(--bad)}

.note{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .stamp{font-size:11px;font-weight:700;color:var(--series-1);flex:none;min-width:40px;
  font-variant-numeric:tabular-nums;padding-top:2px}
.note .body{flex:1;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.note .x{color:var(--faint);cursor:pointer;flex:none}

/* charts — single series, one hue, direct labels */
.bars{margin:2px 0}
.bar{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:9px;
  padding:5px 0}
.bar .lab{font-size:12.5px;color:var(--muted);line-height:1.25}
.bar .track{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--series-1);border-radius:4px;min-width:3px}
.bar .val{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:118px 1fr 40px;gap:9px;font-size:10.5px;
  color:var(--faint);padding-top:4px;font-variant-numeric:tabular-nums}
.axis .ticks{display:flex;justify-content:space-between;border-top:1px solid var(--baseline);
  padding-top:3px}

.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:70;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:18px 18px 0 0;
  padding:17px 15px calc(17px + var(--safe-b));width:100%;max-width:560px;max-height:88vh;
  overflow:auto;animation:up .2s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin-bottom:13px;font-size:17px}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line);margin:-7px auto 13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-b));
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:11px;font-size:14px;
  font-weight:600;z-index:90;box-shadow:0 6px 22px rgba(0,0,0,.28);max-width:88vw;text-align:center}

.syncbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;
  font-size:12.5px;font-weight:600;margin-bottom:11px}
.syncbar.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.syncbar.pending{background:var(--warn-soft);color:var(--warn)}
.syncbar.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.warnbox{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);
  border-radius:11px;padding:11px;margin-bottom:11px}
.warnbox.soft{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.warnbox h4{font-size:13px;margin-bottom:5px;color:var(--bad)}
.warnbox.soft h4{color:var(--warn)}
.warnbox ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.55}
.warnbox code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:5px;font-size:12px}
.ack{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;
  margin:11px 0;cursor:pointer}
.ack input{width:18px;height:18px;flex:none;margin-top:1px}

table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--line)}
table.data th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}

/* header logo */
header.top .logo{width:34px;height:34px;border-radius:99px;background:#fff;flex:none;
  display:block;object-fit:contain;padding:1px}

/* time log */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;
  text-align:left;box-shadow:var(--shadow);min-height:62px}
.catbtn:active{transform:scale(.985)}
.catbtn .cn{font-weight:650;font-size:14px;line-height:1.25}
.catbtn .cm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.catbtn.has{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.catbtn.has .cm{color:var(--brand);font-weight:650}
.catbtn.wide{grid-column:1 / -1}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.daynav button{flex:none;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font-size:18px;cursor:pointer}
.daynav input{flex:1;text-align:center;font-weight:600}
.entry{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.entry:last-child{border-bottom:0}
.entry .m{flex:none;min-width:52px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand)}
.entry .b{flex:1;min-width:0}
.minchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.minchips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;
  padding:7px 12px;font-size:13.5px;font-weight:650;cursor:pointer}
.big-min{font-size:30px!important;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:-6px 0 12px}

/* quick-start tour */
.tour .art{font-size:40px;line-height:1;margin:2px 0 10px}
.tour h3{font-size:20px!important;margin-bottom:8px!important}
.tour ol{margin:0 0 14px;padding-left:20px;font-size:15px;line-height:1.6}
.tour ol li{margin-bottom:5px}
.tour p{font-size:15px;line-height:1.55;margin:0 0 12px}
.tour .dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.tour .dots span{width:7px;height:7px;border-radius:99px;background:var(--line)}
.tour .dots span.on{background:var(--brand);width:18px}
@media print{nav.tabs,header.top,.noprint{display:none!important}body{padding:0;background:#fff}}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
/* ==============================================================
   Saks Admin Hub — classroom walkthroughs + principal time log

   Two modules share one app:
   1. ATOT walkthroughs, with the Saks roster in a dropdown.
   2. A daily time log in the superintendent's seven categories,
      exported as a monthly Excel workbook. Finished walkthroughs
      add their minutes as Instructional Leader time.

   A locally built tool aligned to the Alabama Teacher Observation
   Tool. Not affiliated with, produced by, or endorsed by the Alabama
   State Department of Education.

   Structure follows the Alabama Teacher Observation Tool: five
   dimensions, 23 indicators, rated on the state's 4-point scale.
   This app is a CAPTURE tool for frequent walkthroughs. Official
   ATGP observations are entered in the state ATOT platform; this
   produces the evidence that makes that entry fast and defensible.
   ============================================================== */

/* ---------- ATOT framework ---------- */
const ATOT = [
  { key: "CC", name: "Culture / Climate", short: "Culture",
    desc: "A learning environment in which each learner is cared for, is safe, has a sense of belonging, and feels secure to share thoughts.",
    items: [
      "Fosters an environment that embraces all learners",
      "Treats each learner equitably",
      "Encourages learners to share opinions without fear of negative comments",
      "Creates enthusiasm for the learning at hand" ] },
  { key: "LR", name: "Learning", short: "Learning",
    desc: "Processes established to ensure learners have opportunities to demonstrate understanding of content and apply knowledge and skills.",
    items: [
      "Communicates clear explanations about activities or tasks",
      "Implements lessons stimulating higher-order thinking skills",
      "Delivers lessons relatable to learners or aligned to their interests",
      "Monitors learners' understanding of content / skill acquisition",
      "Adapts instruction and activities to meet individual learner needs",
      "Provides learners purposeful feedback about progress and needs" ] },
  { key: "ES", name: "Essentials", short: "Essentials",
    desc: "Core competencies of an effective teacher: presence and disposition, pedagogical knowledge, content knowledge, and management of the learning environment.",
    items: [
      "Delivers / facilitates the lesson with knowledge and confidence",
      "Communicates and upholds high expectations for learner behaviors",
      "Facilitates use of resources supporting learner needs",
      "Implements instructional strategies actively engaging learners",
      "Manages learning time efficiently and optimally" ] },
  { key: "AG", name: "Agency", short: "Agency",
    desc: "Actions that foster learners' ability to self-direct and self-regulate learning.",
    items: [
      "Empowers learners to be responsible for learning",
      "Gives learners choices about learning activities and tasks",
      "Provides assistance navigating and monitoring learning progress",
      "Encourages learners to persevere with challenging activities and tasks",
      "Builds learners' growth mindset and self-efficacy" ] },
  { key: "RL", name: "Relationships", short: "Relations",
    desc: "Actions that foster healthy, positive connections between the teacher and learners.",
    items: [
      "Promotes respectful and caring interactions toward and between learners",
      "Cultivates learner cooperation, collaboration, and inclusivity",
      "Preserves learners' dignity while attending to individual needs" ] }
];
const SCALE = {
  4: { label: "Very Evident",     pct: "more than 75% of learners" },
  3: { label: "Evident",          pct: "51–74% of learners" },
  2: { label: "Somewhat Evident", pct: "25–50% of learners" },
  1: { label: "Not Evident",      pct: "less than 25% of learners" }
};
const FACTORS = [
  ["impl",  "Implementation of Practices", "Extent the teacher implements observable actions with quality and fidelity"],
  ["auth",  "Authenticity of Practices",   "Degree the practices are embedded in the classroom routinely"],
  ["eff",   "Effect on Learners",          "Extent the practices influence learner engagement and response"]
];
function allIndicators() {
  const out = [];
  ATOT.forEach(d => d.items.forEach((t, i) => out.push({ code: d.key + (i + 1), dim: d.key, text: t })));
  return out;

/* ==============================================================
   STORAGE
   A separate database name from the ATOT app: both apps can live on
   the same github.io origin, and IndexedDB is shared per origin.
   ============================================================== */
const DB_NAME = "adminhubdb", DB_VER = 1;
const STORES = ["staff", "visits", "meta", "time"];
let _db = null;
function openDB() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); });
    };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}
const tx = (s, m) => _db.transaction(s, m).objectStore(s);
async function dbAll(store) {
  await openDB();
  return new Promise(r => { const q = tx(store, "readonly").getAll();
    q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); });
}
async function dbPut(store, obj) {
  await openDB();
  return new Promise(r => { const q = tx(store, "readwrite").put(obj);
    q.onsuccess = () => r(obj); q.onerror = () => r(obj); });
}
async function dbDel(store, id) {
  await openDB();
  return new Promise(r => { const q = tx(store, "readwrite").delete(id);
    q.onsuccess = () => r(); q.onerror = () => r(); });
}
async function dbClear(store) {
  await openDB();
  return new Promise(r => { const q = tx(store, "readwrite").clear();
    q.onsuccess = () => r(); q.onerror = () => r(); });
}

/* Adds any master-schedule teacher not already present. With replace=true,
   also refreshes room/schedule on existing master-schedule entries but keeps
   any name the principal has edited. Visits stay linked by id. */
async function seedRoster(replace) {
  let added = 0;
  for (const r of SAKS_ROSTER) {
    const rec = rosterRecord(r), cur = staffById(rec.id);
    if (!cur) { await dbPut("staff", rec); S.staff.push(rec); added++; }
    else if (replace) {
      Object.assign(cur, { room: rec.room, dept: rec.dept, assignment: rec.assignment,
        schedule: rec.schedule, status: "active", updatedAt: now() });
      await dbPut("staff", cur);
    }
  }
  return added;
}

function esc(s) { return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10); }
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric",
    year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
}
function daysAgo(iso) {
  if (!iso) return null;
  const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso);
  return isNaN(d) ? null : Math.floor((Date.now() - d.getTime()) / 86400000);
}
function agoLabel(iso) {
  const n = daysAgo(iso);
  if (n === null) return "never";
  if (n <= 0) return "today";
  if (n === 1) return "yesterday";
  if (n < 30) return n + "d ago";
  if (n < 365) return Math.round(n / 30) + "mo ago";
  return Math.round(n / 365) + "y ago";
}

   STUDENT-PII GUARD
   Observations are about adults. Individual students should never
   be identifiable in this record.
   ============================================================== */
const HARD_PATTERNS = [
  { re: /\b\d{3}-\d{2}-\d{4}\b/, label: "Social Security number" },
  { re: /[\w.+-]+@[\w-]+\.[A-Za-z]{2,}/, label: "email address" },
  { re: /\b(?:\+?1[-. ])?\(?\d{3}\)?[-. ]\d{3}[-. ]\d{4}\b/, label: "phone number" },
  { re: /\b\d{5,}\b/, label: "ID number" },
  { re: /\b(?:0?[1-9]|1[0-2])[\/\-](?:0?[1-9]|[12]\d|3[01])[\/\-](?:19|20)\d{2}\b/, label: "date of birth" },
  { re: /\b(?:student\s*(?:id|number|#)|lunch\s*(?:id|number)|state\s*id)\s*[:#]?\s*\w+/i, label: "student identifier" }
];
const CONTEXT_PATTERNS = [
  { re: /\b(?:[Aa] |[Tt]he |[Oo]ne )?[Ss]tudents?\s+(?:named|called)\s+([A-Z][a-z]+)/g, label: "student named" },
  { re: /\b(?:[Kk]id|[Cc]hild|[Ll]earner|[Pp]upil)\s+(?:named|called)\s+([A-Z][a-z]+)/g, label: "child named" },
  { re: /\b(?:IEP|504|ELL|MLL|SPED|RTI|MTSS)\s+(?:[Ss]tudents?\s+)?([A-Z][a-z]+)/g, label: "student tied to a service" },
  { re: /\b([A-Z][a-z]+)(?:'s)?\s+(?:IEP|504 plan|behavior plan|diagnosis)/g, label: "student tied to a plan" }
];
const NONNAME = new Set(("monday tuesday wednesday thursday friday saturday sunday january february " +
  "march april may june july august september october november december the this that these those " +
  "i he she they we it her his their our your my a an and but or if when while during after before " +
  "next last first second third final also then most many some all each every few several both " +
  "students student teacher teachers class classroom kids group groups table tables partner partners " +
  "math english science reading writing social studies history biology chemistry physics algebra " +
  "geometry calculus civics geography art music health spanish french german latin " +
  "grade grades unit lesson chapter standard standards domain level room period block day week " +
  "quarter semester trimester fall spring winter summer school district elementary middle high " +
  "there here today tomorrow yesterday now later again still only just even really very much more " +
  "walkthrough observation coaching debrief modeling session cycle goal target evidence data " +
  "culture climate learning essentials agency relationships evident somewhat " +
  "exit ticket warm cool turn talk think pair share cold call wait time depth knowledge " +
  "webb bloom taxonomy common core next generation alabama atot atgp").split(" "));
const ED_PHRASES = new Set(["common core","next generation","depth of knowledge","exit ticket",
  "learning target","success criteria","wait time","cold call","think aloud","close reading",
  "number talk","socratic seminar","turn and","think pair","gradual release","project based",
  "universal design","charlotte danielson","robert marzano","john hattie","doug lemov","carol dweck",
  "very evident","somewhat evident","not evident","teacher growth","observation tool"]);

function allowedNames() {
  const s = new Set();
  const add = v => { if (v) String(v).toLowerCase().split(/\s*,\s*/).forEach(x => { if (x.trim()) s.add(x.trim()); }); };
  S.staff.forEach(t => { add(t.name); add(t.school); });
  if (S.settings) { add(S.settings.observerName); add(S.settings.school); add(S.settings.district); }
  Array.from(s).forEach(n => n.split(/\s+/).forEach(w => { if (w.length > 2) s.add(w); }));
  return s;
}
function scanPII(text) {
  const hard = [], soft = [], seen = new Set();
  if (!text || !text.trim()) return { hard: hard, soft: soft };
  HARD_PATTERNS.forEach(p => {
    const m = text.match(p.re);
    if (m && !seen.has("h" + p.label)) { seen.add("h" + p.label); hard.push({ label: p.label, sample: m[0] }); }
  });
  CONTEXT_PATTERNS.forEach(p => {
    const re = new RegExp(p.re.source, p.re.flags); let m;
    while ((m = re.exec(text)) !== null) {
      const s = m[1] || m[0];
      if (!seen.has("s" + s)) { seen.add("s" + s); soft.push({ label: p.label, sample: s }); }
      if (!re.global) break;
    }
  });
  const allow = allowedNames();
  const pair = /\b([A-Z][a-z]{1,14})\s+([A-Z][a-z]{1,14})\b/g; let m2;
  while ((m2 = pair.exec(text)) !== null) {
    const full = (m2[1] + " " + m2[2]).toLowerCase();
    const w1 = m2[1].toLowerCase(), w2 = m2[2].toLowerCase();
    if (allow.has(full) || ED_PHRASES.has(full)) continue;
    if (NONNAME.has(w1) || NONNAME.has(w2)) continue;
    if (!seen.has("s" + m2[0])) { seen.add("s" + m2[0]); soft.push({ label: "possible full name", sample: m2[0] }); }
  }
  return { hard: hard, soft: soft };
}
function redact(text, f) {
  let out = text, n = 0; const map = {};
  (f.soft || []).forEach(x => { if (!map[x.sample]) { n++; map[x.sample] = "S" + n; }
    out = out.split(x.sample).join(map[x.sample]); });
  (f.hard || []).forEach(x => { out = out.split(x.sample).join("[removed]"); });
  return out;
}
const anyPII = f => f.hard.length > 0 || f.soft.length > 0;
function guard(text, onPass) {
  const f = scanPII(text);
  if (!anyPII(f)) return onPass(text);
  window.__gp = onPass; window.__gt = text; window.__gf = f;
  let h = "";
  if (f.hard.length) h += '<div class="warnbox"><h4>Blocked — this cannot be saved</h4><ul>' +
    f.hard.map(x => "<li>" + esc(x.label) + ": <code>" + esc(x.sample) + "</code></li>").join("") + "</ul></div>";
  if (f.soft.length) h += '<div class="warnbox soft"><h4>Looks like it might name a person</h4><ul>' +
    f.soft.map(x => "<li><code>" + esc(x.sample) + "</code> — " + esc(x.label) + "</li>").join("") + "</ul></div>";
  h += '<p class="tiny muted" style="margin:0 0 12px">Observation records are about the teacher. ' +
    'Describe what a student did, not who they are — <b>S1</b>, "a student at the back table", ' +
    '"the group nearest the door".</p>';
  h += '<div class="tiny" style="background:var(--bg);padding:10px;border-radius:9px;' +
    'white-space:pre-wrap;margin-bottom:12px"><b>Cleaned version:</b><br>' + esc(redact(text, f)) + "</div>";
  h += '<button class="btn pri full" onclick="guardClean()">Use the cleaned version</button>';
  h += '<button class="btn full" style="margin-top:8px" onclick="closeSheet()">Go back and edit</button>';
  if (f.hard.length === 0)
    h += '<label class="ack"><input type="checkbox" onchange="document.getElementById(\'gk\').disabled=!this.checked">' +
      "<span>None of the flagged names are students — they are adults, authors, or curriculum names.</span></label>" +
      '<button class="btn full" id="gk" disabled onclick="guardKeep()">Keep as written</button>';
  sheet("Check before saving", h);
}
function guardClean() { const c = redact(window.__gt, window.__gf); closeSheet(); window.__gp(c);
  toast("Saved with identifiers removed"); }
function guardKeep() { closeSheet(); window.__gp(window.__gt); }

      "Teacher Actions", "Student Actions", "Student Engagement %",
      "Strengths", "Growth Area", "Next Steps", "Evidence Notes"]);
}
function sheetRow(v) {
  const dimAvgs = ATOT.map(d => {
    const vals = d.items.map((_, i) => v.scores[d.key + (i + 1)]).filter(x => x > 0);
    return vals.length ? round1(vals.reduce((a, b) => a + b, 0) / vals.length) : "";
  });
  const rated = Object.values(v.scores).filter(x => x > 0);
  const overall = rated.length ? round1(rated.reduce((a, b) => a + b, 0) / rated.length) : "";
  const ckPct = k => {
    const items = CHECKLISTS[k].items, ans = items.filter(it => v.checks[k] && v.checks[k][it[0]] !== undefined);
    if (!ans.length) return "";
    const yes = ans.filter(it => v.checks[k][it[0]] === true).length;
    return Math.round(yes / ans.length * 100);
  };
  const concerns = [];
  Object.keys(CHECKLISTS).forEach(k => CHECKLISTS[k].items.forEach(it => {
    if (v.checks[k] && v.checks[k][it[0]] === false) concerns.push(it[1]);
  }));
  const tallyStr = (list, obj) => list.filter(a => obj[a[0]])
    .sort((a, b) => obj[b[0]] - obj[a[0]]).map(a => a[1] + " (" + obj[a[0]] + ")").join("; ");
  const sTot = STUDENT_ACTIONS.reduce((n, a) => n + (v.studentActions[a[0]] || 0), 0);
  const sOff = v.studentActions.s_off || 0;
  const engaged = sTot ? Math.round((sTot - sOff) / sTot * 100) : "";

  return [v.createdAt, v.id, v.observerName || "", v.school || "", v.teacherName || "",
    v.gradeSubject || "", v.period || "", v.date, v.mode === "full" ? "Full ATOT" : "Walkthrough",
    Math.round((v.durationSec || 0) / 60), v.studentCount || ""]
    .concat(INDICATORS.map(i => v.scores[i.code] || ""))
    .concat(dimAvgs)
    .concat([overall, rated.length, ckPct("room"), ckPct("systems"), ckPct("safety"),
      concerns.join("; "),
      tallyStr(TEACHER_ACTIONS, v.teacherActions), tallyStr(STUDENT_ACTIONS, v.studentActions),
      engaged, v.strengths || "", v.growth || "", v.nextSteps || "",
      (v.notes || []).map(n => mmss(n.at) + " " + n.text).join(" | ")]);
}
function pendingVisits() { return S.visits.filter(v => v.syncState !== "synced"); }
function pendingTime() { return S.time.filter(e => e.syncState !== "synced"); }
function timeUrl() { return S.settings.timeSheetUrl || S.settings.sheetUrl; }
function pendingCount() {
  return (S.settings.sheetUrl ? pendingVisits().length : 0) +
    (timeUrl() ? pendingTime().length + S.tomb.ids.length : 0);
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ token: "adminhub-v1" }, body))
  });
  const txt = await res.text();
  let j = null; try { j = JSON.parse(txt); } catch (e) {}
  return { res: res, j: j };
}

let _syncing = false;
async function syncNow(manual) {
  const url = S.settings.sheetUrl, turl = timeUrl();
  if (!url && !turl) { if (manual) toast("Add your Sheet link in Settings first"); return; }
  if (_syncing) return;
  if (!navigator.onLine) { if (manual) toast("No connection — queued for later"); return; }
  if (!pendingCount()) { if (manual) toast("Everything is already synced"); return; }
  _syncing = true; renderSyncBar("working");
  let ok = 0, failed = 0;
  const secret = S.settings.sheetSecret || "";
  if (url) for (const v of pendingVisits()) {
    try {
      const r = await postJSON(url, { secret: secret, kind: "visit", visitId: v.id,
        header: sheetHeader(), row: sheetRow(v) });
      if (r.res.ok && r.j && (r.j.status === "ok" || r.j.status === "duplicate")) {
        v.syncState = "synced"; v.syncedAt = now(); await dbPut("visits", v); ok++;
      } else { v.syncState = "error"; v.syncError = (r.j && r.j.message) || ("HTTP " + r.res.status);
        await dbPut("visits", v); failed++; }
    } catch (e) {
      v.syncState = "error"; v.syncError = e.message; await dbPut("visits", v); failed++;
    }
  }
  if (turl) {
    for (const e of pendingTime()) {
      try {
        const r = await postJSON(turl, { secret: secret, kind: "time", entryId: e.id,
          header: timeHeader(), row: timeRow(e) });
        if (r.res.ok && r.j && r.j.status === "ok") {
          e.syncState = "synced"; e.syncedAt = now(); await dbPut("time", e); ok++;
        } else { e.syncState = "error"; e.syncError = (r.j && r.j.message) || ("HTTP " + r.res.status);
          await dbPut("time", e); failed++; }
      } catch (err) { e.syncState = "error"; e.syncError = err.message; await dbPut("time", e); failed++; }
    }
    for (const id of S.tomb.ids.slice()) {
      try {
        const r = await postJSON(turl, { secret: secret, kind: "time", entryId: id, deleted: true });
        if (r.res.ok && r.j && r.j.status === "ok") {
          S.tomb.ids = S.tomb.ids.filter(x => x !== id); await dbPut("meta", S.tomb); ok++;
        } else failed++;
      } catch (err) { failed++; }
    }
  }
  S.settings.lastSync = now(); await saveSettings();
  _syncing = false;
  if (manual || ok) toast(ok + " sent" + (failed ? ", " + failed + " failed" : ""));
  route();
}
function syncStatus() {
  const p = pendingCount();
  if (!S.settings.sheetUrl && !timeUrl()) return { cls: "off", txt: "Saving to this device only — connect a Sheet in More" };
  if (!navigator.onLine) return { cls: "pending", txt: p ? p + " item(s) waiting for a connection" : "Offline — all synced" };
  if (_syncing) return { cls: "pending", txt: "Sending to your Sheet…" };
  if (p) return { cls: "pending", txt: p + " item(s) not yet in the Sheet — tap to send" };
  return { cls: "ok", txt: "Everything is in your Sheet" };
}
function renderSyncBar(state) {
  const el = document.getElementById("syncbar");
  if (!el) return;
  const s = syncStatus();
  el.className = "syncbar " + s.cls;
  el.innerHTML = "<div class='grow'>" + esc(s.txt) + "</div>" +
    (pendingCount() && navigator.onLine && !_syncing ? "<b>Send now ›</b>" : "");
}
window.addEventListener("online", () => { if (S.settings && S.settings.autoSync) syncNow(false); });

const LOGO = '<img class="logo" src="' + LOGO_SRC + '" alt="Saks High School">';
const ROUTES = [
  [/^#\/home$/,        () => viewHome()],
  [/^#\/staff$/,       () => viewStaff()],
  [/^#\/teacher\/(.+)$/, m => viewTeacher(m[1])],
  [/^#\/new$/,         () => viewNew()],
  [/^#\/capture$/,     () => viewCapture()],
  [/^#\/visit\/(.+)$/, m => viewVisit(m[1])],
  [/^#\/reports$/,     () => viewReports()],
  [/^#\/more$/,        () => viewMore()],
  [/^#\/sheet$/,       () => viewSheetSetup()],
  [/^#\/time$/,        () => viewTime()],
  [/^#\/month$/,       () => viewMonth()]
];
function route() {
  closeSheet();
  const h = location.hash || "#/home";
  for (const [re, fn] of ROUTES) {
    const m = h.match(re);
    if (m) {
      const base = "#/" + h.slice(2).split("/")[0];
      const tab = { "#/capture": "#/new", "#/visit": "#/home", "#/teacher": "#/new",
        "#/staff": "#/new", "#/sheet": "#/more", "#/month": "#/time" }[base] || base;
      renderTabs(TABS.some(t => t.hash === h) ? h : tab);
      window.scrollTo(0, 0);
      return fn(m);
    }
  }
  location.hash = "#/home";
}

/* ==============================================================
   VIEW: HOME
   ============================================================== */
function viewHome() {
  const s = S.settings;
  setHeader("Admin Hub", (s.observerName ? s.observerName + " · " : "") + (s.school || SCHOOL_NAME), LOGO,
    '<button onclick="location.hash=\'#/time\'">+ Time</button>');

  const today = S.visits.filter(v => v.date === todayISO());
  const week = S.visits.filter(v => daysAgo(v.date) !== null && daysAgo(v.date) <= 7);
  const active = S.staff.filter(t => t.status !== "inactive");
  const notSeen = active.filter(t => {
    const last = lastVisitFor(t.id);
    return !last || daysAgo(last) > (s.visitCadenceDays || 30);
  });

  let h = '<div class="syncbar" id="syncbar" onclick="syncNow(true)"></div>';
  h += homeTimeCard();
  h += '<div class="sect">Walkthroughs</div>';

  if (!S.staff.length) {
    h += '<div class="card"><h3 style="margin-bottom:6px">Set up in two minutes</h3>' +
      '<p class="muted tiny" style="margin:0 0 12px">Add your teachers, then connect a Google Sheet ' +
      'if you want visits to roll up automatically. Everything works offline either way.</p>' +
      '<div class="btnrow"><button class="btn pri" onclick="addStaffSheet()">Add teachers</button>' +
      '<button class="btn" onclick="location.hash=\'#/sheet\'">Connect Sheet</button></div></div>';
  }
  h += '<div class="stats">' +
    '<div class="stat"><div class="n">' + today.length + '</div><div class="l">Today</div></div>' +
    '<div class="stat"><div class="n">' + week.length + '</div><div class="l">This week</div></div>' +
    '<div class="stat"><div class="n">' + notSeen.length + '</div><div class="l">Not seen</div></div></div>';

  if (S.draft && S.draft.teacherId) {
    h += '<div class="card tap" style="border-color:var(--brand)" onclick="location.hash=\'#/capture\'">' +
      '<div class="row"><div class="grow"><span class="pill warn">In progress</span>' +
      '<div style="margin-top:6px;font-weight:650">' + esc(sName(S.draft.teacherId)) + "</div>" +
      '<div class="tiny muted">Unfinished observation — tap to resume</div></div>' +
      '<div style="font-size:20px;color:var(--brand)">›</div></div></div>';
  }
  if (notSeen.length) {
    h += '<div class="sect">Haven\'t visited recently</div>';
    h += notSeen.slice(0, 6).map(t =>
      '<div class="card tap" onclick="startVisit(\'' + t.id + '\')">' +
      '<div class="row"><div class="grow"><div style="font-weight:650" class="trunc">' + esc(t.name) + "</div>" +
      '<div class="tiny muted trunc">' + esc(t.assignment || "—") + " · last " +
      agoLabel(lastVisitFor(t.id)) + "</div></div>" +
      '<span class="pill">Observe ›</span></div></div>').join("");
  }
  h += '<div class="sect">Recent visits</div>';
  const recent = S.visits.slice().sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, 8);
  h += recent.length ? recent.map(visitCard).join("") :
    '<div class="card"><div class="empty"><span class="big">▤</span>' +
    "No visits logged yet.<br>Tap <b>Observe</b> to start one.</div></div>";
  document.getElementById("app").innerHTML = h;
  renderSyncBar();
}
function lastVisitFor(teacherId) {
  const v = S.visits.filter(x => x.teacherId === teacherId)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return v.length ? v[0].date : null;
}
function overallOf(v) {
  const r = Object.values(v.scores || {}).filter(x => x > 0);
  return r.length ? round1(r.reduce((a, b) => a + b, 0) / r.length) : null;
}
function visitCard(v) {
  const ov = overallOf(v);
  const rated = Object.values(v.scores || {}).filter(x => x > 0).length;
  return '<div class="card tap" onclick="location.hash=\'#/visit/' + v.id + '\'">' +
    '<div class="row between"><div class="grow">' +
    '<div style="font-weight:650" class="trunc">' + esc(v.teacherName || sName(v.teacherId)) + "</div>" +
    '<div class="tiny muted">' + (v.mode === "full" ? "Full ATOT" : "Walkthrough") + " · " +
    fmtDate(v.date) + " · " + Math.round((v.durationSec || 0) / 60) + " min</div></div>" +
    (ov !== null ? '<div style="text-align:right"><div style="font-weight:700;font-size:17px;' +
      'font-variant-numeric:tabular-nums">' + ov.toFixed(1) + "</div>" +
      '<div class="mini muted">' + rated + " rated</div></div>" : "") + "</div>" +
    '<div class="hr"></div><div class="row between mini muted"><div>' +
    (v.nextSteps ? esc(v.nextSteps.slice(0, 46)) + (v.nextSteps.length > 46 ? "…" : "") : "No next step recorded") +
    "</div>" +
    (v.syncState === "synced" ? '<span class="pill ok">in Sheet</span>' :
      S.settings.sheetUrl ? '<span class="pill warn">pending</span>' : "") + "</div></div>";
}

/* ==============================================================
   VIEW: STAFF
   ============================================================== */
let staffFilter = "";
function viewStaff() {
  setHeader("Staff", S.staff.length + " teachers · " + (S.settings.school || SCHOOL_NAME), backBtn,
    '<button onclick="addStaffSheet()">+ Add</button>');
  let h = "";
  if (S.staff.length > 6)
    h += '<label class="f"><input type="text" placeholder="Search" value="' + esc(staffFilter) +
      '" oninput="staffFilter=this.value;document.getElementById(\'sl\').innerHTML=staffListHTML()"></label>';
  h += '<div id="sl">' + staffListHTML() + "</div>";
  h += '<div class="btnrow" style="margin-top:12px"><button class="btn" onclick="bulkStaffSheet()">Paste names</button>' +
    '<button class="btn" onclick="reseedRoster()">Reload master schedule</button></div>' +
    '<p class="mini muted" style="margin:9px 2px 0;line-height:1.5">Reloading adds anyone missing from the ' +
    "2026–27 master schedule and refreshes rooms and blocks. Names you have edited are kept.</p>";
  document.getElementById("app").innerHTML = h;
}
function staffListHTML() {
  const q = staffFilter.toLowerCase();
  const list = S.staff.filter(t => !q || (t.name + " " + (t.assignment || "")).toLowerCase().includes(q))
    .sort((a, b) => (a.status === "inactive") - (b.status === "inactive") || a.name.localeCompare(b.name));
  if (!list.length) return '<div class="card"><div class="empty"><span class="big">◍</span>' +
    (S.staff.length ? "No matches." : "No teachers yet.<br>Add them one at a time or paste a roster.") + "</div></div>";
  return list.map(t => {
    const n = S.visits.filter(v => v.teacherId === t.id).length;
    const avg = teacherAvg(t.id);
    return '<div class="card tap" onclick="location.hash=\'#/teacher/' + t.id + '\'">' +
      '<div class="row"><div class="grow"><div class="row between" style="gap:8px">' +
      '<div style="font-weight:650" class="trunc">' + esc(t.name) + "</div>" +
      (avg !== null ? '<span class="pill flat" style="font-variant-numeric:tabular-nums">' +
        avg.toFixed(1) + "</span>" : "") + "</div>" +
      '<div class="tiny muted trunc">' + esc(t.assignment || "—") + "</div>" +
      '<div class="mini muted" style="margin-top:2px">' + n + " visit" + (n === 1 ? "" : "s") +
      " · last " + agoLabel(lastVisitFor(t.id)) + "</div></div></div></div>";
  }).join("");
}
function teacherAvg(id) {
  const vs = S.visits.filter(v => v.teacherId === id).map(overallOf).filter(x => x !== null);
  return vs.length ? round1(vs.reduce((a, b) => a + b, 0) / vs.length) : null;
}
function addStaffSheet(id) {
  const t = id ? staffById(id) : null;
  sheet(t ? "Edit teacher" : "Add teacher",
    '<label class="f"><span>Name</span><input type="text" id="s_name" value="' + esc(t ? t.name : "") +
      '" placeholder="Last name, or first and last"></label>' +
    '<label class="f"><span>Department / courses</span><input type="text" id="s_assign" value="' +
      esc(t ? t.assignment || "" : "") + '" placeholder="Math · Alg 1, Geo"></label>' +
    '<label class="f"><span>Room</span><input type="text" id="s_room" value="' +
      esc(t ? t.room || "" : "") + '" placeholder="204"></label>' +
    '<label class="f"><span>Status</span><select id="s_status">' +
      '<option value="active"' + (t && t.status === "inactive" ? "" : " selected") + ">Active</option>" +
      '<option value="inactive"' + (t && t.status === "inactive" ? " selected" : "") + ">Inactive</option>" +
      "</select></label>" +
    '<button class="btn pri full" onclick="saveStaff(' + (t ? "'" + t.id + "'" : "null") + ')">Save</button>');
}
async function saveStaff(id) {
  const name = val("s_name");
  if (!name) return toast("A name is required");
  const t = id ? Object.assign({}, staffById(id)) : { id: uid(), createdAt: now() };
  t.name = name; t.assignment = val("s_assign"); t.room = val("s_room");
  t.status = val("s_status"); t.school = S.settings.school; t.updatedAt = now();
  await dbPut("staff", t);
  const i = S.staff.findIndex(x => x.id === t.id);
  if (i >= 0) S.staff[i] = t; else S.staff.push(t);
  closeSheet(); toast(id ? "Updated" : "Added"); route();
}
function bulkStaffSheet() {
  sheet("Paste a roster",
    '<p class="tiny muted" style="margin:0 0 12px">One teacher per line. Optionally add a comma and ' +
    'their grade or subject:<br><code>Jordan Ellis, 4th grade ELA</code></p>' +
    '<label class="f"><textarea id="bulk" style="min-height:170px" ' +
      'placeholder="Jordan Ellis, 4th grade ELA&#10;Priya Raman, 7th grade math"></textarea></label>' +
    '<button class="btn pri full" onclick="saveBulk()">Add all</button>');
}

/* ==============================================================
   CHART — single series, one hue, direct labels, no legend
   ============================================================== */
function barChart(rows, max, caption) {
  const m = max || Math.max.apply(null, rows.map(r => r.value)) || 1;
  let h = '<div class="bars">';
  rows.forEach(r => {
    const pct = Math.max(0, Math.min(100, r.value / m * 100));
    h += '<div class="bar"><div class="lab">' + esc(r.label) + "</div>" +
      '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="val">' + (r.value ? r.value.toFixed(1) : "—") + "</div></div>";
  });
  h += "</div>";
  h += '<div class="axis"><div></div><div class="ticks"><span>0</span><span>' +
    (m === 4 ? "1" : "") + "</span><span>" + (m === 4 ? "2" : "") + "</span><span>" +
    (m === 4 ? "3" : "") + "</span><span>" + m + "</span></div><div></div></div>";
  if (caption) h += '<div class="mini muted" style="margin-top:7px">' + esc(caption) + "</div>";
  return h;
}

/* ---------- schedule helpers ---------- */
function scheduleHalf(dateISO) {
  const pref = S.settings.scheduleHalf;
  if (pref === "1" || pref === "2") return "s" + pref;
  const m = new Date((dateISO || todayISO()) + "T12:00:00").getMonth();   // 0 = Jan
  return m >= 6 ? "s1" : "s2";                                           // Jul–Dec first half
}
function hm(str) { const p = str.split(":"); return +p[0] * 60 + +p[1]; }
function fmtClock(str) { let h = +str.slice(0, 2); const m = str.slice(3);
  return (h > 12 ? h - 12 : h) + ":" + m; }
function blockAt(d) {
  d = d || new Date();
  if (d.getDay() === 0 || d.getDay() === 6) return null;
  const mins = d.getHours() * 60 + d.getMinutes();
  return BLOCKS.find(b => mins >= hm(b.start) && mins <= hm(b.end)) || null;
}
/* What the teacher is scheduled to be teaching right now, if anything. */
function teacherNow(t) {
  const b = blockAt();
  if (!b || !t || !t.schedule) return null;
  const course = (t.schedule[scheduleHalf()] || [])[b.n - 1] || "";
  return { block: b, course: course };
}
function teacherOption(t) {
  return esc(t.name) + (t.dept ? " — " + esc(t.dept) : "") + (t.room ? " · Rm " + esc(t.room) : "");
}

let _tick = null, _pending = "";
function elapsed() {
  const d = S.draft; if (!d) return 0;
  return d.elapsed + (d.running ? (Date.now() - d.startedAt) / 1000 : 0);
}
const SECTIONS = [
  ["atot",    "ATOT"],
  ["actions", "Actions"],
  ["room",    "Room"],
  ["systems", "Systems"],
  ["safety",  "Safety"],
  ["notes",   "Notes"],
  ["wrap",    "Wrap up"]
];
function sectionDone(key) {
  const d = S.draft;
  if (key === "atot") return Object.keys(d.scores).length > 0;
  if (key === "actions") return Object.keys(d.teacherActions).length + Object.keys(d.studentActions).length > 0;
  if (key === "notes") return d.notes.length > 0;
  if (key === "wrap") return !!(d.strengths || d.growth || d.nextSteps);
  if (CHECKLISTS[key]) return Object.keys(d.checks[key] || {}).length > 0;
  return false;
}
function viewCapture() {
  const d = S.draft;
  if (!d || !d.teacherId) { location.hash = "#/new"; return; }
  const target = d.mode === "full" ? 20 : 5;
  setHeader(d.teacherName || sName(d.teacherId),
    (d.mode === "full" ? "Full ATOT" : "Walkthrough") + " · " + fmtDate(d.date), backBtn,
    '<button onclick="finishSheet()">Finish</button>');

  const mins = elapsed() / 60;
  let h = '<div class="timer"><div class="grow"><div class="clock" id="clk">' + mmss(elapsed()) + "</div>" +
    '<div style="font-size:11px;opacity:.75;margin-top:2px">' +
    (d.running ? "Recording" : "Paused") + " · target " + target + " min" +
    (mins > target ? " · over" : "") + "</div></div>" +
    '<button onclick="toggleTimer()">' + (d.running ? "Pause" : "Resume") + "</button></div>";

  const visible = SECTIONS.filter(s => {
    if (CHECKLISTS[s[0]]) return S.settings.sections[s[0]] !== false;
    if (s[0] === "actions") return S.settings.sections.actions !== false;
    return true;
  });
  h += '<div class="chips">' + visible.map(s =>
    '<button class="' + (d.section === s[0] ? "on" : "") + '" onclick="setSection(\'' + s[0] + '\')">' +
    esc(s[1]) + (sectionDone(s[0]) ? '<span class="dot"></span>' : "") + "</button>").join("") + "</div>";

  h += '<div id="sect">' + sectionHTML(d.section) + "</div>";
  h += '<div class="btnrow" style="margin-top:15px">' +
    '<button class="btn dan" onclick="confirmDiscard()">Discard</button>' +
    '<button class="btn pri" onclick="finishSheet()">Finish</button></div>';
  document.getElementById("app").innerHTML = h;
  startTick();
}
function startTick() {
  clearInterval(_tick);
  _tick = setInterval(() => {
    const c = document.getElementById("clk");
    if (!c || !S.draft) { clearInterval(_tick); return; }
    c.textContent = mmss(elapsed());
  }, 1000);
}
async function toggleTimer() {
  const d = S.draft; if (!d) return;
  if (d.running) { d.elapsed = elapsed(); d.running = false; } else { d.startedAt = Date.now(); d.running = true; }
  await saveDraft(); viewCapture();
}
async function setSection(k) { S.draft.section = k; await saveDraft(); viewCapture(); }
function refreshSection() {
  const el = document.getElementById("sect");

  document.querySelectorAll(".chips button").forEach((b, i) => {
    const key = SECTIONS.filter(s => CHECKLISTS[s[0]] ? S.settings.sections[s[0]] !== false :

  let h = '<div class="card"><label class="f" style="margin-bottom:8px"><span>Timestamped evidence note</span>' +
    '<textarea id="ntxt" oninput="_pending=this.value" style="min-height:70px" ' +
    'placeholder="Quote what was said, describe what was done. Evidence, not judgment.">' +
    esc(_pending) + "</textarea></label>" +
    '<div class="chips" style="padding-bottom:8px">' +
    ["S1","S2","S3","Teacher said","Student said","Strength","Concern","Ask about"].map(q =>
      '<button onclick="quick(' + JSON.stringify(q).replace(/"/g, "&quot;") + ')">' + esc(q) + "</button>").join("") +
    "</div><button class='btn pri full' onclick='addNote()'>Add note</button></div>";
  if (d.notes.length) h += '<div class="sect">Evidence log · ' + d.notes.length + "</div><div class=\"card\">" +
    d.notes.slice().reverse().map(n => '<div class="note"><div class="stamp">' + mmss(n.at) + "</div>" +
      '<div class="body">' + esc(n.text) + "</div>" +
      '<div class="x" onclick="delNote(\'' + n.id + '\')">✕</div></div>').join("") + "</div>";

}
function quick(t) {
  const el = document.getElementById("ntxt");
  el.value = el.value ? el.value.replace(/\s*$/, "") + " " + t + " " : t + ": ";
  _pending = el.value; el.focus(); el.setSelectionRange(el.value.length, el.value.length);
}
function addNote() {
  const el = document.getElementById("ntxt"), raw = el.value.trim();
  if (!raw) return toast("Nothing to add");
  guard(raw, async function (clean) {
    S.draft.notes.push({ id: uid(), at: elapsed(), text: clean });
    _pending = ""; await saveDraft(); refreshSection(); toast("Noted");
  });
}
async function delNote(id) {
  S.draft.notes = S.draft.notes.filter(n => n.id !== id);
  await saveDraft(); refreshSection();
}
function wrapHTML() {
  const d = S.draft;
  const lowest = INDICATORS.filter(i => d.scores[i.code] > 0)
    .sort((a, b) => d.scores[a.code] - d.scores[b.code]).slice(0, 3);
  const highest = INDICATORS.filter(i => d.scores[i.code] > 0)
    .sort((a, b) => d.scores[b.code] - d.scores[a.code]).slice(0, 3);
  let h = "";
  if (highest.length) {
    h += '<div class="card"><div class="mini muted" style="font-weight:700;text-transform:uppercase;' +
      'letter-spacing:.05em;margin-bottom:7px">Strongest this visit</div>' +
      highest.map(i => '<div class="tiny" style="padding:3px 0">' +
        '<b style="color:var(--series-1)">' + d.scores[i.code] + "</b> " + esc(i.text) + "</div>").join("") +
      '<div class="hr"></div><div class="mini muted" style="font-weight:700;text-transform:uppercase;' +
      'letter-spacing:.05em;margin-bottom:7px">Lowest this visit</div>' +
      lowest.map(i => '<div class="tiny" style="padding:3px 0">' +
        '<b style="color:var(--series-1)">' + d.scores[i.code] + "</b> " + esc(i.text) + "</div>").join("") +
      "</div>";
  }
  h += '<div class="card">' +
    '<label class="f"><span>Strength to name for the teacher</span>' +
      '<textarea id="w_str" onchange="wrapSave(\'strengths\',this.value)">' + esc(d.strengths) + "</textarea></label>" +
    '<label class="f"><span>Growth area</span><textarea id="w_gro" onchange="wrapSave(\'growth\',this.value)">' +
      esc(d.growth) + "</textarea></label>" +
    '<label class="f" style="margin-bottom:0"><span>Next step / follow-up</span>' +
      '<textarea id="w_nxt" onchange="wrapSave(\'nextSteps\',this.value)" ' +
      'placeholder="Small, observable, and dated.">' + esc(d.nextSteps) + "</textarea></label></div>";
  return h;
}
function wrapSave(k, v) {
  guard(v, async function (clean) {
    S.draft[k] = clean; await saveDraft();
    const map = { strengths: "w_str", growth: "w_gro", nextSteps: "w_nxt" };
    const el = document.getElementById(map[k]); if (el) el.value = clean;
  });
}
function confirmDiscard() {

async function finishVisit() {
  const d = S.draft; if (!d) return;
  const mins = parseInt(val("f_min") || "0", 10) || Math.round(elapsed() / 60);
  const v = {
    id: d.visitId, teacherId: d.teacherId, teacherName: d.teacherName,
    gradeSubject: d.gradeSubject, period: d.period, studentCount: d.studentCount,
    date: d.date, mode: d.mode, focusDims: d.focusDims,
    scores: d.scores, teacherActions: d.teacherActions, studentActions: d.studentActions,
    checks: d.checks, notes: d.notes,
    strengths: d.strengths, growth: d.growth, nextSteps: d.nextSteps,
    observerName: d.observerName || S.settings.observerName, school: d.school || S.settings.school,
    durationSec: mins * 60, createdAt: d.createdAt, syncState: "pending"
  };
  await dbPut("visits", v);
  const i = S.visits.findIndex(x => x.id === v.id);
  if (i >= 0) S.visits[i] = v; else S.visits.push(v);
  const logged = await upsertAtotTime(v);
  S.draft = null; _pending = ""; await dbDel("meta", "draft");
  clearInterval(_tick); closeSheet();
  toast(logged ? "Saved · " + mins + " min logged as Instructional Leader" : "Observation saved");
  location.hash = "#/visit/" + v.id;
  if (S.settings.autoSync) setTimeout(() => syncNow(false), 400);
}

      await dbDel("visits", id); S.visits = S.visits.filter(v => v.id !== id);

function visitToText(v) {
  const L = [];
  L.push((v.teacherName || sName(v.teacherId)) + " — " + (v.mode === "full" ? "Full ATOT observation" : "Walkthrough"));
  L.push(fmtDate(v.date) + " · " + Math.round((v.durationSec || 0) / 60) + " min" +
    (v.observerName ? " · " + v.observerName : ""));
  L.push("");
  ATOT.forEach(d => {
    const rated = d.items.map((t, i) => ({ t: t, s: v.scores[d.key + (i + 1)] })).filter(x => x.s > 0);
    if (!rated.length) return;
    const avg = round1(rated.reduce((a, b) => a + b.s, 0) / rated.length);
    L.push(d.name.toUpperCase() + "  (avg " + avg.toFixed(1) + ")");
    rated.forEach(x => L.push("  " + x.s + "  " + x.t));
    L.push("");
  });
  if (v.strengths) { L.push("STRENGTH"); L.push("  " + v.strengths); L.push(""); }
  if (v.growth) { L.push("GROWTH AREA"); L.push("  " + v.growth); L.push(""); }
  if (v.nextSteps) { L.push("NEXT STEP"); L.push("  " + v.nextSteps); L.push(""); }
  const concerns = [];
  Object.keys(CHECKLISTS).forEach(k => CHECKLISTS[k].items.forEach(it => {
    if (v.checks[k] && v.checks[k][it[0]] === false) concerns.push(it[1]);
  }));
  if (concerns.length) { L.push("FLAGGED"); concerns.forEach(c => L.push("  ✕ " + c)); L.push(""); }
  if ((v.notes || []).length) { L.push("EVIDENCE"); v.notes.forEach(n => L.push("  " + mmss(n.at) + "  " + n.text)); }
  L.push(""); L.push("Rating scale: 4 Very Evident, 3 Evident, 2 Somewhat Evident, 1 Not Evident.");
  L.push("Contains no student-identifying information.");
  return L.join("\n");
}
async function shareVisit(id) {
  const v = S.visits.find(x => x.id === id);
  const text = visitToText(v);
  if (navigator.share) { try { await navigator.share({ title: "Observation summary", text: text }); return; } catch (e) {} }
  try { await navigator.clipboard.writeText(text); toast("Summary copied"); }
  catch (e) { sheet("Observation summary",
    '<textarea style="min-height:300px;font-size:13px">' + esc(text) + "</textarea>"); }
}

let reportRange = 90;
function viewReports() {
  setHeader("Reports", "Building-wide patterns");
  const inRange = S.visits.filter(v => { const d = daysAgo(v.date); return d !== null && d <= reportRange; });
  let h = '<div class="chips">' + [[30, "30 days"], [90, "90 days"], [180, "Semester"], [3650, "All"]]
    .map(r => '<button class="' + (reportRange === r[0] ? "on" : "") + '" onclick="reportRange=' + r[0] +
      ';viewReports()">' + r[1] + "</button>").join("") + "</div>";

  if (!inRange.length) {
    h += '<div class="card"><div class="empty"><span class="big">▥</span>' +
      "No observations in this range yet.</div></div>";
    document.getElementById("app").innerHTML = h; return;
  }
  const active = S.staff.filter(t => t.status !== "inactive");
  const seen = new Set(inRange.map(v => v.teacherId));
  const totalMin = inRange.reduce((n, v) => n + Math.round((v.durationSec || 0) / 60), 0);

  h += '<div class="stats">' +
    '<div class="stat"><div class="n">' + inRange.length + '</div><div class="l">Visits</div></div>' +
    '<div class="stat"><div class="n">' + seen.size + "/" + active.length + '</div><div class="l">Teachers seen</div></div>' +
    '<div class="stat"><div class="n">' + totalMin + '</div><div class="l">Minutes</div></div></div>';

  /* dimension averages — single series, one hue */
  const dimRows = ATOT.map(d => {
    const all = [];
    inRange.forEach(v => d.items.forEach((_, i) => { const s = v.scores[d.key + (i + 1)]; if (s > 0) all.push(s); }));
    return { label: d.short, value: all.length ? round1(all.reduce((a, b) => a + b, 0) / all.length) : 0, n: all.length };
  }).filter(r => r.n);
  if (dimRows.length) h += '<div class="sect">Average by ATOT dimension</div><div class="card">' +
    barChart(dimRows, 4, "Scale: 1 Not Evident to 4 Very Evident. Bars show the mean of every rating in range.") +
    "</div>";

  /* weakest indicators */
  const indStats = INDICATORS.map(i => {
    const vals = inRange.map(v => v.scores[i.code]).filter(x => x > 0);
    return { code: i.code, text: i.text,
      value: vals.length ? round1(vals.reduce((a, b) => a + b, 0) / vals.length) : 0, n: vals.length };
  }).filter(x => x.n >= 2);
  if (indStats.length) {
    const low = indStats.slice().sort((a, b) => a.value - b.value).slice(0, 5);
    const high = indStats.slice().sort((a, b) => b.value - a.value).slice(0, 5);
    h += '<div class="sect">Lowest-rated indicators — where to put PD</div><div class="card">' +
      barChart(low.map(x => ({ label: x.code, value: x.value })), 4) +
      '<div class="hr"></div>' + low.map(x => '<div class="mini muted" style="padding:2px 0">' +
        "<b>" + x.code + "</b> " + esc(x.text) + " · " + x.n + " ratings</div>").join("") + "</div>";
    h += '<div class="sect">Strongest indicators — where to find your models</div><div class="card">' +
      barChart(high.map(x => ({ label: x.code, value: x.value })), 4) +
      '<div class="hr"></div>' + high.map(x => '<div class="mini muted" style="padding:2px 0">' +
        "<b>" + x.code + "</b> " + esc(x.text) + " · " + x.n + " ratings</div>").join("") + "</div>";
  }

  /* engagement + checklists */
  let sTot = 0, sOff = 0;
  inRange.forEach(v => STUDENT_ACTIONS.forEach(a => {
    const n = v.studentActions[a[0]] || 0; sTot += n; if (a[0] === "s_off") sOff += n;
  }));
  const ckRows = Object.keys(CHECKLISTS).map(k => {
    let yes = 0, tot = 0;
    inRange.forEach(v => CHECKLISTS[k].items.forEach(it => {
      const a = v.checks[k] && v.checks[k][it[0]];
      if (a !== undefined) { tot++; if (a === true) yes++; }
    }));
    return { label: CHECKLISTS[k].name, value: tot ? round1(yes / tot * 4) : 0, pct: tot ? Math.round(yes / tot * 100) : 0, n: tot };
  }).filter(r => r.n);
  if (sTot || ckRows.length) {
    h += '<div class="sect">Environment &amp; engagement</div><div class="card">';
    if (sTot) h += '<div class="row between" style="margin-bottom:9px">' +
      '<div class="tiny muted">Student engagement across all visits</div>' +
      '<div style="font-weight:700">' + Math.round((sTot - sOff) / sTot * 100) + "%</div></div>";
    if (ckRows.length) h += '<table class="data"><tr><th>Checklist</th><th style="text-align:right">Met</th>' +
      '<th style="text-align:right">Items</th></tr>' +
      ckRows.map(r => "<tr><td>" + esc(r.label) + '</td><td class="n">' + r.pct + '%</td><td class="n">' +
        r.n + "</td></tr>").join("") + "</table>";
    h += "</div>";
  }

  /* coverage */
  const unseen = active.filter(t => !seen.has(t.id));
  h += '<div class="sect">Coverage</div><div class="card">';
  if (unseen.length) {
    h += '<div class="tiny" style="margin-bottom:7px"><b>' + unseen.length +
      "</b> not observed in this range:</div>" +
      unseen.map(t => '<div class="tiny muted" style="padding:2px 0">' + esc(t.name) +
        " · last " + agoLabel(lastVisitFor(t.id)) + "</div>").join("");
  } else h += '<div class="tiny">Every active teacher has been observed in this range.</div>';
  h += "</div>";

  h += '<button class="btn full" style="margin-top:12px" onclick="exportCSV()">Download CSV of all visits</button>';
  document.getElementById("app").innerHTML = h;
}

/* ==============================================================
   TIME LOG
   One record per block of time: { id, date, category, minutes,
   afterHours, note, source: "manual" | "atot", visitId }.
   Minutes are whole numbers the principal enters. Walkthroughs add
   their own Instructional Leader entry when they are finished.
   ============================================================== */
let timeDate = null;          // the day showing on the Time tab
let monthKey = null;          // "YYYY-MM" showing on the Month view

function fmtMin(m) {
  m = Math.round(m || 0);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60), r = m % 60;
  return h + "h" + (r ? " " + r + "m" : "");
}
function hrs(m) { return (Math.round((m || 0) / 60 * 100) / 100).toFixed(2); }
function shiftDate(iso, n) {
  const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isWeekend(iso) { const g = new Date(iso + "T12:00:00").getDay(); return g === 0 || g === 6; }
function dayLabel(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function entriesOn(iso) {
  return S.time.filter(e => e.date === iso).sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
}
function totalsOf(list) {
  const t = { all: 0, after: 0 };
  TIME_CATS.forEach(c => { t[c.key] = 0; });
  list.forEach(e => { t[e.category] = (t[e.category] || 0) + e.minutes; t.all += e.minutes;
    if (e.afterHours) t.after += e.minutes; });
  return t;
}
function monthEntries(key) { return S.time.filter(e => (e.date || "").slice(0, 7) === key); }
function monthName(key) {
  return new Date(key + "-15T12:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });
}
function shiftMonth(key, n) {
  const d = new Date(key + "-15T12:00:00"); d.setMonth(d.getMonth() + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function daysInMonth(key) {
  const y = +key.slice(0, 4), m = +key.slice(5, 7), n = new Date(y, m, 0).getDate(), out = [];
  for (let i = 1; i <= n; i++) out.push(key + "-" + String(i).padStart(2, "0"));
  return out;
}
/* Weekdays up to yesterday, within the last `back` days, with nothing logged. */
function missingWeekdays(back) {
  const out = [], today = todayISO();
  /* don't nag about days before the app was in use */
  const start = S.time.reduce((m, e) => e.date < m ? e.date : m, (S.settings.createdAt || now()).slice(0, 10));
  for (let i = 1; i <= back; i++) {
    const d = shiftDate(today, -i);
    if (d >= start && !isWeekend(d) && !S.time.some(e => e.date === d)) out.push(d);
  }
  return out.reverse();
}

/* ---------- store ---------- */
async function putTime(e) {
  e.updatedAt = now(); e.syncState = "pending";
  await dbPut("time", e);
  const i = S.time.findIndex(x => x.id === e.id);
  if (i >= 0) S.time[i] = e; else S.time.push(e);
  if (S.settings.autoSync && timeUrl()) setTimeout(() => syncNow(false), 300);
}
async function dropTime(id) {
  const e = S.time.find(x => x.id === id);
  if (!e) return;
  await dbDel("time", id);
  S.time = S.time.filter(x => x.id !== id);
  if (e.syncedAt) { S.tomb.ids.push(id); await dbPut("meta", S.tomb); }   // remove the Sheet row too
}
async function upsertAtotTime(v) {
  if (!S.settings.atotCountsAsTime) return false;
  const mins = Math.round((v.durationSec || 0) / 60);
  if (mins < 1) return false;
  const cur = S.time.find(e => e.visitId === v.id);
  const e = Object.assign(cur || { id: "t" + uid(), createdAt: now() }, {
    date: v.date, category: "instructional", minutes: mins, afterHours: isWeekend(v.date),
    note: (v.mode === "full" ? "Full ATOT observation" : "ATOT walkthrough") + " — " + (v.teacherName || ""),
    teacherName: v.teacherName || "", source: "atot", visitId: v.id });
  await putTime(e);
  return true;
}
async function removeAtotTime(visitId) {
  const e = S.time.find(x => x.visitId === visitId);
  if (e) await dropTime(e.id);
}

function catHint() {
  const k = val("t_cat"), c = CAT[k];
  document.getElementById("t_hint").textContent = c ? c.hint : "";
  document.getElementById("t_notelab").textContent = k === "other" ? "Note — required for Other" : "Note (optional)";
  document.getElementById("t_note").placeholder = k === "other" ? "What was it? A few words is enough." :
    "Optional — e.g. parent conference, bus duty";
}
function addMin(n) {
  const el = document.getElementById("t_min");
  el.value = Math.min(1440, (parseInt(el.value || "0", 10) || 0) + n);
}
function fromTo() {
  const a = val("t_from"), b = val("t_to");
  if (!a || !b) return;
  let m = hm(b) - hm(a);
  if (m <= 0) m += 1440;                       // crossed midnight
  document.getElementById("t_min").value = m;
}
function saveEntry() {
  const id = window.__eid, cat = val("t_cat"), mins = parseInt(val("t_min") || "0", 10);
  const date = val("t_date") || todayISO(), note = val("t_note");
  if (!CAT[cat]) return toast("Pick a category");
  if (!(mins >= 1)) return toast("Enter the minutes");
  if (mins > 1440) return toast("That is more than a day");
  if (cat === "other" && !note) return toast("Add a short note for Other");
  const dayTot = S.time.filter(x => x.date === date && x.id !== id).reduce((n, x) => n + x.minutes, 0) + mins;
  const after = document.getElementById("t_after").checked;
  guard(note, async function (clean) {
    const cur = id ? S.time.find(x => x.id === id) : null;
    const e = Object.assign(cur ? Object.assign({}, cur) : { id: "t" + uid(), createdAt: now(), source: "manual" },
      { date: date, category: cat, minutes: mins, afterHours: after, note: clean });
    await putTime(e);
    closeSheet();
    timeDate = date;
    toast((id ? "Updated" : "Added") + " · " + fmtMin(dayTot) + " logged " +
      (date === todayISO() ? "today" : "on " + dayLabel(date)) + (dayTot > 900 ? " — check that total" : ""));
    route();
  });
}
function delEntry(id) {
  const e = S.time.find(x => x.id === id);
  confirmSheet("Delete this entry?", e.minutes + " min of " + CAT[e.category].name + " on " + dayLabel(e.date) +
    " will be removed" + (e.syncedAt ? ", here and in the Sheet." : "."), "Delete", async () => {
      await dropTime(id); toast("Deleted"); route();
      if (S.settings.autoSync && timeUrl()) setTimeout(() => syncNow(false), 300);
    });
}

/* ==============================================================
   EXCEL (.xlsx) — written directly, no library, works offline.
   An .xlsx is a zip of XML parts; this stores them uncompressed.
   Formulas carry cached values so previews (iPhone Files, Mail)
   show the numbers before Excel recalculates.
   ============================================================== */
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {          // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255], u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const DT = u16(0), DD = u16((2026 - 1980) << 9 | 1 << 5 | 1);
  files.forEach(f => {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new Uint8Array([0x50, 0x4b, 3, 4].concat(u16(20), u16(0x0800), u16(0), DT, DD, u32(crc), u32(sz), u32(sz),
      u16(nm.length), u16(0)));
    parts.push(lh, nm, f.data);
    central.push(new Uint8Array([0x50, 0x4b, 1, 2].concat(u16(20), u16(20), u16(0x0800), u16(0), DT, DD, u32(crc),
      u32(sz), u32(sz), u16(nm.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), nm);
    off += lh.length + nm.length + sz;
  });
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const end = new Uint8Array([0x50, 0x4b, 5, 6].concat(u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(off), u16(0)));
  return new Blob(parts.concat(central, [end]),
    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xesc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")

  '<font><i/><sz val="9"/><color rgb="FF666666"/><name val="Calibri"/><family val="2"/></font>' +
